name: ReplenishPlusPlus
main: dev.replenishplusplus.ReplenishPlusPlus
version: "${project.version}"
api-version: "26.3"
description: "Auto-replant for Paper/Purpur. Break a crop, it goes right back in the ground. Replenish from Hypixel SkyBlock, but for your own server :)"
authors: [ "Mitra-88" ]
website: "https://github.com/Mitra-88/ReplenishPlusPlus"

dependencies:
  server:
    spark:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  replenishplusplus.use:
    description: Allows the player to use the main /replenishplusplus command and view help.
    default: true
  replenishplusplus.toggle:
    description: Allows the player to toggle auto-replant for themselves personally.
    default: true
  replenishplusplus.toggle.global:
    description: Allows an admin to toggle auto-replant globally for the whole server.
    default: op
  replenishplusplus.status:
    description: Allows the player to view the plugin status and active settings.
    default: true
  replenishplusplus.reload:
    description: Allows an admin to reload the config.yml.
    default: op
  replenishplusplus.version:
    description: Allows the player to view the plugin version and update status.
    default: true
  replenishplusplus.debug:
    description: Allows an admin to view queue debug statistics.
    default: op
  replenishplusplus.dev:
    description: Toggles developer mode.
    default: op
  replenishplusplus.pad:
    description: Allows receiving a Teleport Pad item via /rpp pad.
    default: op
  replenishplusplus.update:
    description: Allows an admin to receive in-game update notifications on join.
    default: op
  replenishplusplus.*:
    description: Grants every ReplenishPlusPlus permission.
    default: op
    children:
      replenishplusplus.use: true
      replenishplusplus.toggle: true
      replenishplusplus.toggle.global: true
      replenishplusplus.status: true
      replenishplusplus.reload: true
      replenishplusplus.version: true
      replenishplusplus.debug: true
      replenishplusplus.dev: true
      replenishplusplus.pad: true
      replenishplusplus.update: true
