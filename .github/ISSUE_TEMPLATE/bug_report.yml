name: "Bug Report"
description: "Something's broken. Tell me what."
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Check [the issue tracker](https://github.com/Mitra-88/ReplenishPlusPlus/issues) first. If someone already reported it, comment there instead of opening a duplicate.

  - type: markdown
    attributes:
      value: |
        ---
        ### What happened?

  - type: textarea
    id: "what-happened"
    attributes:
      label: "Describe the bug"
      description: |
        What went wrong, what you expected instead, and how to reproduce it. Steps matter - "it doesn't work" doesn't help me.
      placeholder: |
        1. Planted wheat on farmland
        2. Waited for full growth
        3. Broke it with a diamond hoe
        4. Crop did not replant. Expected it to.
    validations:
      required: true

  - type: dropdown
    id: "crop-type"
    attributes:
      label: "Which crop?"
      description: "If it's not crop-specific, pick Multiple / All Crops."
      options:
        - "Wheat"
        - "Carrots"
        - "Potatoes"
        - "Nether Wart"
        - "Cocoa"
        - "Beetroots"
        - "Multiple / All Crops"
    validations:
      required: true

  - type: dropdown
    id: "tool-used"
    attributes:
      label: "What were you holding?"
      description: "Hoes trigger crops, Axes trigger Cocoa. Bare hands trigger nothing."
      options:
        - "Hoe (Wood, Stone, Copper, Iron, Gold, Diamond, Netherite)"
        - "Axe (Wood, Stone, Copper, Iron, Gold, Diamond, Netherite)"
        - "Bare hands"
        - "Something else"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Server info

  - type: dropdown
    id: "server-software"
    attributes:
      label: "Server software"
      description: "Paper or a Paper fork. Folia doesn't work with this plugin, and that's not something I'm going to fix."
      options:
        - "PaperMC"
        - "Purpur"
        - "Leaf"
        - "Other (mention it in Additional Context)"
    validations:
      required: true

  - type: input
    id: "server-version"
    attributes:
      label: "Minecraft version"
      description: "Run `/version` in console. Paste the full output, not just the number."
      placeholder: "This server is running Paper version 26.3-32-dev/26.3@0c803ba (2026-09-21T17:06:10Z) (Implementing API version 26.3.build.32-alpha)"
    validations:
      required: true

  - type: input
    id: "plugin-version"
    attributes:
      label: "Replenish++ version"
      description: "`/replenishplusplus version` in-game or console."
      placeholder: "v7.0.0"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Config & logs

  - type: dropdown
    id: "config-settings"
    attributes:
      label: "How is Replenish configured? (seeds & pickup)"
      description: "`requirePlayerSeed` and `directPickup` in config.yml."
      options:
        - "Defaults (seeds required + direct pickup)"
        - "Seeds required, drops on ground"
        - "No seeds required, direct pickup"
        - "No seeds required, drops on ground"
        - "Haven't touched the config"
    validations:
      required: true

  - type: dropdown
    id: "sneak-to-bypass"
    attributes:
      label: "sneakToBypass setting"
      description: "Sneaking while breaking a crop skips auto-replant entirely."
      options:
        - "Enabled (default)"
        - "Disabled"
        - "Haven't touched the config"
    validations:
      required: true

  - type: dropdown
    id: "message-style"
    attributes:
      label: "messageStyle setting"
      description: "How player-facing notifications (inventory full, need seed, wrong tool) are shown."
      options:
        - "CHAT (default)"
        - "ACTION_BAR"
        - "NONE"
        - "Haven't touched the config"
    validations:
      required: true

  - type: textarea
    id: "logs"
    attributes:
      label: "Console errors / logs"
      description: |
        If there's a stack trace or error in console, I need it. Don't paste 400 lines here, use [mclo.gs](https://mclo.gs/) or [Pastebin](https://pastebin.com/) and drop the link.
        No errors? Just write "none".
      placeholder: "https://mclo.gs/..."
    validations:
      required: true

  - type: textarea
    id: "plugins"
    attributes:
      label: "Other plugins"
      description: |
        List anything that touches farming, block breaking, or inventories: mcMMO, anti-cheats, Essentials, etc. This helps rule out conflicts.
        Heads up: I don't fix compatibility issues with other plugins. If yours turns out to be a conflict, I'll close the issue and add the plugin to a known-incompatible list so others can check before reporting the same thing.
      placeholder: "EssentialsX, mcMMO, NoCheatPlus..."
    validations:
      required: false

  - type: textarea
    id: "additional-context"
    attributes:
      label: "Anything else"
      description: "Screenshots, video, extra context. Whatever helps."
    validations:
      required: false