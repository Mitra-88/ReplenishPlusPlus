name: Build ReplenishPlusPlus

on:
  push:
    branches: [ "7.x.x" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@97c5a5e13aa773f277f72c1287dda3c789f1366c
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Cache local Maven repository
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Read project version
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload Artifact with version, build number, and short SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ReplenishPlusPlus-${{ steps.version.outputs.version }}+build.${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}
          path: target/*.jar
